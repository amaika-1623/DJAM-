<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mena Muria Klok, Radio, Wekker & Kalender</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MM Klok">
  <meta name="theme-color" content="#0f0d0b">

  <link rel="manifest" href='data:application/manifest+json,{"name":"Mena Muria Klok","short_name":"MM Klok","start_url":".","display":"standalone","background_color":"#0f0d0b","theme_color":"#0f0d0b","orientation":"portrait"}'>

  <style>
    :root {
      --bg-color: #0f0d0b;
      --gold-light: #f5d77f;
      --gold-mid: #c89d2a;
      --gold-dark: #826211;
      --rms-blue: #0033a0;
      --rms-white: #ffffff;
      --rms-green: #007a33;
      --rms-red: #d52b1e;
      --card-bg: #14100c;
      --border-color: #4a3822;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--gold-light);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 10px 140px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--gold-light);
      text-shadow: 2px 2px 4px #000;
    }

    header p {
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--gold-mid);
      margin-top: 2px;
    }

    .main-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.9);
      margin-bottom: 15px;
    }

    .clock-container {
      position: relative;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d251d 0%, #16120e 70%, #0a0806 100%);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.95), inset 0 0 15px rgba(0, 0, 0, 0.85);
      border: 5px solid #231c15;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    .rope-ring {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      border: 2px dashed var(--gold-dark);
      opacity: 0.6;
    }

    .number {
      position: absolute;
      font-weight: bold;
      font-size: 1.2rem;
      color: var(--gold-light);
      text-shadow: 1px 1px 3px #000, 0 0 6px var(--gold-dark);
      text-align: center;
    }

    .num-12 { top: 6px; }
    .num-1  { top: 18px; right: 58px; }
    .num-2  { top: 52px; right: 18px; }
    .num-3  { right: 10px; top: 118px; }
    .num-4  { bottom: 52px; right: 18px; }
    .num-5  { bottom: 18px; right: 58px; }
    .num-6  { bottom: 6px; }
    .num-7  { bottom: 18px; left: 58px; }
    .num-8  { bottom: 52px; left: 18px; }
    .num-9  { left: 10px; top: 118px; }
    .num-10 { top: 52px; left: 18px; }
    .num-11 { top: 18px; left: 58px; }

    .emblem-wrapper {
      position: absolute;
      width: 180px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .arc-text-top {
      position: absolute;
      top: 24px;
      font-size: 0.6rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--gold-light);
    }

    .center-title {
      position: absolute;
      top: 38px;
      font-size: 0.95rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--gold-light);
      z-index: 3;
    }

    .wings-svg {
      position: absolute;
      width: 160px;
      height: 65px;
      top: 50px;
      z-index: 1;
    }

    .center-shield {
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: radial-gradient(circle, #a32a2a 0%, #4a0d0d 100%);
      border: 2px solid var(--gold-mid);
      top: 56px;
      z-index: 2;
    }

    .ribbon-dates {
      position: absolute;
      top: 98px;
      width: 120px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 0.68rem;
      color: var(--gold-light);
      z-index: 3;
    }

    .arc-text-bottom {
      position: absolute;
      bottom: 28px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--gold-light);
    }

    .date-foundation {
      position: absolute;
      bottom: 14px;
      font-size: 0.58rem;
      font-weight: bold;
      color: var(--gold-light);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
      z-index: 10;
      background: linear-gradient(to right, var(--gold-dark), var(--gold-light), var(--gold-mid));
    }

    .hour-hand { width: 5px; height: 42px; margin-left: -2.5px; }
    .minute-hand { width: 3px; height: 65px; margin-left: -1.5px; }
    .second-hand { width: 2px; height: 75px; margin-left: -1px; background: var(--rms-red); z-index: 11; }

    .center-cap {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--gold-light), var(--gold-dark));
      border: 2px solid #111;
      z-index: 12;
    }

    .bottom-label {
      font-size: 1.3rem;
      font-weight: bold;
      letter-spacing: 4px;
      color: var(--gold-light);
      margin-bottom: 4px;
    }

    .digital-display {
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
      width: 100%;
    }

    .date-text { color: var(--gold-mid); font-size: 0.7rem; }
    .time-text { color: var(--gold-light); font-size: 1.15rem; font-weight: bold; letter-spacing: 2px; }

    .section-title {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--gold-mid);
      margin-bottom: 8px;
      width: 100%;
    }

    .controls-row {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 8px;
    }

    select, input[type="text"], input[type="number"], input[type="url"], input[type="time"] {
      -webkit-appearance: none !important;
      -moz-appearance: none !important;
      appearance: none !important;
      background-color: #1a140e !important;
      color: #f5d77f !important;
      border: 1px solid #c89d2a !important;
      border-radius: 4px !important;
      padding: 8px 10px !important;
      font-size: 0.85rem !important;
      font-family: 'Georgia', serif !important;
      outline: none !important;
      width: 100% !important;
      display: block !important;
    }

    select option {
      background-color: #1a140e !important;
      color: #f5d77f !important;
    }

    .media-btn, .alarm-btn, .cal-btn {
      background: linear-gradient(to bottom, var(--gold-light), var(--gold-mid)) !important;
      color: #000 !important;
      border: none !important;
      border-radius: 4px !important;
      padding: 8px 12px !important;
      font-weight: bold !important;
      font-size: 0.85rem !important;
      cursor: pointer !important;
      white-space: nowrap !important;
    }

    .video-screen-wrapper {
      width: 100%;
      height: 200px;
      background-color: #000;
      border: 1px solid var(--gold-mid);
      border-radius: 6px;
      overflow: hidden;
      display: none;
      margin-top: 8px;
    }

    .video-screen-wrapper iframe { width: 100%; height: 100%; border: none; }
    .media-status { font-size: 0.7rem; color: var(--gold-mid); margin-top: 6px; text-align: center; }

    .alarm-container {
      margin-top: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
      width: 100%;
    }

    .calendar-header-row {
      display: flex;
      gap: 6px;
      width: 100%;
      margin-bottom: 8px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      margin-top: 6px;
    }

    .cal-day-name {
      color: var(--gold-mid);
      font-weight: bold;
      padding: 4px 0;
    }

    .cal-day {
      padding: 8px 0;
      background: rgba(30, 24, 18, 0.9);
      border-radius: 3px;
      color: var(--gold-light);
    }

    .cal-day.empty { background: transparent; }
    .cal-day.today { border: 1px solid var(--gold-light); background: rgba(200, 157, 42, 0.4); font-weight: bold; }
    .cal-day.selected { background: var(--gold-mid); color: #000; font-weight: bold; }
  </style>
</head>
<body>

    <h1>MENA MURIA</h1>
    <p>KLOK • RADIO • WEKKER • EEUWKALENDER</p>
  </header>

  <!-- Klok Kaart -->

  <div class="main-card">
    <div class="section-title">📻 STREAM & RADIO SPELER</div>

        <optgroup label="📻 Radiostations">
          <option
